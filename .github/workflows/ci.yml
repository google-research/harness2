# Every check here is offline: no credentials, no benchmark checkout, no model
# call. Actions are pinned to a commit and the token is read-only, so this
# workflow needs no secret and can grant none.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_DIR: harness2-demo-run

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Pinned so a ruff release cannot turn an unrelated pull request red.
      - run: pip install ruff==0.17.1
      - run: ruff check .

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # dependencies = [] in pyproject.toml, and the tests are stdlib unittest,
      # so the test job installs nothing beyond the package itself.
      - run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Release asset provenance
        run: python scripts/check_provenance.py
      - name: Offline demo (real recursion and library, deterministic editors)
        run: harness2-demo --output "$RUNNER_TEMP/$DEMO_DIR" --k 2
